<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatQuery AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { background: #1a1a2e; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        header h1 { font-size: 1.5rem; font-weight: 600; }
        header p { opacity: 0.8; margin-top: 4px; font-size: 0.9rem; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card h2 { font-size: 1.1rem; margin-bottom: 16px; color: #333; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; color: #444; }
        input[type="text"], textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem; font-family: inherit; }
        input[type="file"] { padding: 8px; }
        textarea { min-height: 80px; resize: vertical; }
        .row { display: flex; gap: 16px; }
        .row > * { flex: 1; }
        button { background: #1a1a2e; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: 500; }
        button:hover { background: #2d2d4e; }
        button:disabled { background: #999; cursor: not-allowed; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .results { margin-top: 20px; }
        .result-item { border: 1px solid #eee; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .result-rank { background: #1a1a2e; color: white; padding: 2px 8px; border-radius: 3px; font-size: 0.8rem; }
        .confidence { padding: 2px 8px; border-radius: 3px; font-size: 0.8rem; font-weight: 500; }
        .confidence.high { background: #d4edda; color: #155724; }
        .confidence.medium { background: #fff3cd; color: #856404; }
        .confidence.low { background: #f8d7da; color: #721c24; }
        .confidence.unknown { background: #e2e3e5; color: #383d41; }
        .result-meta { font-size: 0.85rem; color: #666; margin-bottom: 8px; }
        .result-explanation { font-size: 0.9rem; line-height: 1.5; }
        .score-breakdown { display: flex; gap: 12px; margin-top: 8px; font-size: 0.8rem; color: #666; flex-wrap: wrap; }
        
        /* SAR-specific styling */
        .sar-panel { background: #f8f9fa; border-left: 4px solid #6c757d; padding: 12px; margin-top: 12px; border-radius: 0 4px 4px 0; }
        .sar-panel h4 { font-size: 0.9rem; color: #495057; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .sar-badge { background: #6c757d; color: white; padding: 2px 6px; border-radius: 3px; font-size: 0.7rem; }
        .sar-features { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
        .sar-feature { background: white; padding: 8px; border-radius: 4px; border: 1px solid #dee2e6; }
        .sar-feature-label { font-size: 0.7rem; color: #6c757d; text-transform: uppercase; }
        .sar-feature-value { font-size: 0.9rem; font-weight: 600; color: #333; }
        .fusion-panel { background: #e8f4fd; border-left: 4px solid #1a1a2e; padding: 12px; margin-top: 12px; border-radius: 0 4px 4px 0; }
        .fusion-panel h4 { font-size: 0.9rem; color: #1a1a2e; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .fusion-badge { background: #1a1a2e; color: white; padding: 2px 6px; border-radius: 3px; font-size: 0.7rem; }
        
        .trace-panel { margin-top: 20px; }
        .trace-toggle { background: #6c757d; font-size: 0.85rem; padding: 8px 16px; }
        .trace-content { display: none; background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 4px; font-family: monospace; font-size: 0.8rem; overflow-x: auto; margin-top: 8px; white-space: pre-wrap; }
        .trace-content.open { display: block; }
        .error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 4px; margin-top: 16px; }
        .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        
        /* Config status indicator */
        .config-status { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 500; }
        .status-badge.mock { background: #fff3cd; color: #856404; }
        .status-badge.real { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SatQuery AI</h1>
            <p>Natural-Language Cross-Modal Earth Observation Retrieval & Analysis</p>
        </header>

        <!-- Config Status -->
        <div class="config-status" id="configStatus">
            <span class="status-badge mock" id="vlmStatus">VLM: Checking...</span>
            <span class="status-badge mock" id="sarStatus">SAR VLM: Checking...</span>
            <span class="status-badge mock" id="changeStatus">Change: Checking...</span>
        </div>

        <!-- Query Section -->
        <div class="card">
            <h2>Natural Language Query</h2>
            <div class="form-group">
                <label for="queryText">Query</label>
                <textarea id="queryText" placeholder="e.g., Show me Sentinel-2 images of agriculture near Delhi from June 2024"></textarea>
            </div>
            <div class="row">
                <div class="form-group">
                    <label for="imageId">Image ID (optional)</label>
                    <input type="text" id="imageId" placeholder="Scene ID from catalog">
                </div>
            </div>
            <button id="btnQuery" onclick="runQuery()">Run Query</button>
        </div>

        <!-- Upload Section -->
        <div class="card">
            <h2>Direct Image Upload</h2>
            <div class="row">
                <div class="form-group">
                    <label>Image 1 (required)</label>
                    <input type="file" id="file1" accept=".tif,.tiff,.png,.jpg,.jpeg" required>
                </div>
                <div class="form-group">
                    <label>Image 2 (optional, for fusion/change)</label>
                    <input type="file" id="file2" accept=".tif,.tiff,.png,.jpg,.jpeg">
                </div>
            </div>
            <div class="form-group">
                <label for="question">Question (optional, for VQA)</label>
                <input type="text" id="question" placeholder="e.g., What is the land cover type?">
            </div>
            <div class="form-group">
                <label for="intent">Intent (optional)</label>
                <select id="intent">
                    <option value="">Auto-detect</option>
                    <option value="caption">Caption</option>
                    <option value="vqa">VQA</option>
                    <option value="fusion">Fusion</option>
                    <option value="change">Change Detection</option>
                </select>
            </div>
            <button id="btnUpload" onclick="runUpload()">Upload & Analyze</button>
        </div>

        <!-- Results Section -->
        <div class="card results" id="resultsSection" style="display: none;">
            <h2>Results</h2>
            <div id="resultsContainer"></div>
            
            <div class="trace-panel">
                <button class="trace-toggle" onclick="toggleTrace()">Show Raw Trace JSON</button>
                <div class="trace-content" id="traceContent"></div>
            </div>
        </div>

        <div class="error hidden" id="errorBox"></div>
    </div>

    <script>
        // Load config status on page load
        async function loadConfigStatus() {
            try {
                const res = await fetch('/config-status');
                if (res.ok) {
                    const status = await res.json();
                    updateConfigStatus(status);
                }
            } catch (e) {
                console.warn('Could not load config status:', e);
            }
        }

        function updateConfigStatus(status) {
            const vlmEl = document.getElementById('vlmStatus');
            const sarEl = document.getElementById('sarStatus');
            const changeEl = document.getElementById('changeStatus');
            
            vlmEl.textContent = 'VLM: ' + (status.vlm_mock ? 'Mock' : 'Real');
            vlmEl.className = 'status-badge ' + (status.vlm_mock ? 'mock' : 'real');
            
            sarEl.textContent = 'SAR VLM: ' + (status.sar_mock ? 'Mock' : 'Real');
            sarEl.className = 'status-badge ' + (status.sar_mock ? 'mock' : 'real');
            
            changeEl.textContent = 'Change: ' + (status.change_mock ? 'Mock' : 'Real');
            changeEl.className = 'status-badge ' + (status.change_mock ? 'mock' : 'real');
        }

        async function apiRequest(endpoint, data, isFormData = false) {
            const res = await fetch(endpoint, {
                method: 'POST',
                body: isFormData ? data : JSON.stringify(data),
                headers: isFormData ? {} : { 'Content-Type': 'application/json' }
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.detail || `HTTP ${res.status}`);
            }
            return res.json();
        }

        function setLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="loading"></span>Processing...';
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.original;
            }
        }

        function renderResults(response) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';
            
            if (!response.results || response.results.length === 0) {
                container.innerHTML = '<p style="color:#666;">No results found.</p>';
            } else {
                response.results.forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    const confClass = r.confidence_band || 'unknown';
                    
                    // Build model outputs HTML
                    let outputsHtml = '';
                    const mo = r.model_outputs || {};
                    
                    if (mo.caption) {
                        outputsHtml += `<div style="margin-top:8px;"><strong>Caption:</strong> ${mo.caption}</div>`;
                    }
                    if (mo.vqa_answer) {
                        outputsHtml += `<div style="margin-top:8px;"><strong>VQA Answer:</strong> ${mo.vqa_answer}</div>`;
                    }
                    if (mo.change_description) {
                        outputsHtml += `<div style="margin-top:8px;"><strong>Change Description:</strong> ${mo.change_description}</div>`;
                    }
                    
                    // SAR-specific outputs
                    if (mo.sar_caption || mo.sar_features || mo.sar_vqa_answer) {
                        outputsHtml += `
                        <div class="sar-panel">
                            <h4><span class="sar-badge">SAR Analysis</span></h4>
                            ${mo.sar_caption ? `<div style="margin-bottom:8px;"><strong>SAR Caption:</strong> ${mo.sar_caption}</div>` : ''}
                            ${mo.sar_vqa_answer ? `<div style="margin-bottom:8px;"><strong>SAR VQA:</strong> ${mo.sar_vqa_answer}</div>` : ''}
                            ${mo.sar_features ? `
                            <div class="sar-features">
                                ${mo.sar_features.water_fraction !== undefined ? `<div class="sar-feature"><div class="sar-feature-label">Water Fraction</div><div class="sar-feature-value">${(mo.sar_features.water_fraction * 100).toFixed(1)}%</div></div>` : ''}
                                ${mo.sar_features.builtup_fraction !== undefined ? `<div class="sar-feature"><div class="sar-feature-label">Built-up Fraction</div><div class="sar-feature-value">${(mo.sar_features.builtup_fraction * 100).toFixed(1)}%</div></div>` : ''}
                                ${mo.sar_features.log_ratio_mean !== undefined ? `<div class="sar-feature"><div class="sar-feature-label">Log Ratio Mean</div><div class="sar-feature-value">${mo.sar_features.log_ratio_mean.toFixed(3)}</div></div>` : ''}
                                ${mo.sar_features.notes ? `<div class="sar-feature" style="grid-column: 1/-1; font-size:0.75rem; color:#6c757d;">${mo.sar_features.notes}</div>` : ''}
                            </div>
                            ` : ''}
                        </div>` : ''}
                    
                    // Fusion statement
                    if (mo.fusion_statement) {
                        outputsHtml += `
                        <div class="fusion-panel">
                            <h4><span class="fusion-badge">Fusion Synthesis</span></h4>
                            <div>${mo.fusion_statement}</div>
                        </div>`;
                    }
                    
                    if (mo.change_description) {
                        outputsHtml += `<div style="margin-top:8px;"><strong>Change:</strong> ${mo.change_description}</div>`;
                    }
                    
                    div.innerHTML = `
                        <div class="result-header">
                            <span class="result-rank">Rank #${r.rank}</span>
                            <span class="confidence ${confClass}">${(r.confidence_band || 'unknown').toUpperCase()}</span>
                        </div>
                        <div class="result-meta">
                            Image: ${r.image_id} | Sensor: ${r.metadata?.sensor || 'N/A'} | 
                            Acquired: ${r.metadata?.acquisition_time || 'N/A'} | 
                            Score: ${r.score?.toFixed(2) || 'N/A'}
                        </div>
                        <div class="result-explanation">${r.explanation_text || 'No explanation'}</div>
                        <div class="score-breakdown">
                            <span>Semantic: ${r.score_breakdown?.semantic_sim?.toFixed(2) || 'N/A'}</span>
                            <span>Geo: ${r.score_breakdown?.geo_score?.toFixed(2) || 'N/A'}</span>
                            <span>Temporal: ${r.score_breakdown?.temporal_score?.toFixed(2) || 'N/A'}</span>
                            <span>Modality: ${r.score_breakdown?.modality_score?.toFixed(2) || 'N/A'}</span>
                            <span>Change: ${r.score_breakdown?.change_score?.toFixed(2) || 'N/A'}</span>
                        </div>
                        ${outputsHtml}
                    `;
                    container.appendChild(div);
                });
            }
            
            // Trace
            document.getElementById('traceContent').textContent = JSON.stringify(response.trace, null, 2);
            
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('errorBox').classList.add('hidden');
        }

        function showError(msg) {
            const box = document.getElementById('errorBox');
            box.textContent = msg;
            box.classList.remove('hidden');
            document.getElementById('resultsSection').style.display = 'none';
        }

        function toggleTrace() {
            const content = document.getElementById('traceContent');
            content.classList.toggle('open');
        }

        async function runQuery() {
            const btn = document.getElementById('btnQuery');
            if (!btn.dataset.original) btn.dataset.original = btn.innerHTML;
            setLoading(btn, true);
            showError('');
            
            try {
                const queryText = document.getElementById('queryText').value.trim();
                if (!queryText) throw new Error('Query text is required');
                
                const imageId = document.getElementById('imageId').value.trim() || null;
                
                const response = await apiRequest('/query', { query_text: queryText, image_id: imageId });
                renderResults(response);
            } catch (e) {
                showError(e.message);
            } finally {
                setLoading(btn, false);
            }
        }

        async function runUpload() {
            const btn = document.getElementById('btnUpload');
            if (!btn.dataset.original) btn.dataset.original = btn.innerHTML;
            setLoading(btn, true);
            showError('');
            
            try {
                const file1 = document.getElementById('file1').files[0];
                if (!file1) throw new Error('Image 1 is required');
                
                const file2 = document.getElementById('file2').files[0] || null;
                const question = document.getElementById('question').value.trim() || null;
                const intent = document.getElementById('intent').value || null;
                
                const formData = new FormData();
                formData.append('file', file1);
                if (file2) formData.append('file2', file2);
                if (question) formData.append('question', question);
                if (intent) formData.append('intent', intent);
                
                const res = await fetch('/upload', { method: 'POST', body: formData });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || `HTTP ${res.status}`);
                }
                const response = await res.json();
                renderResults(response);
            } catch (e) {
                showError(e.message);
            } finally {
                setLoading(btn, false);
            }
        }

        // Enter key support
        document.getElementById('queryText').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                runQuery();
            }
        });

        // Load config status on startup
        loadConfigStatus();
    </script>
</body>
</html>
